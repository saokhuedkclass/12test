<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Trực Tuyến</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #f0f0f0; }
        
        /* MÀN HÌNH KHÓA BẮT BUỘC NHẬP DANH TÍNH */
        #authOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #1a1a1a;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .auth-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .auth-card button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        /* KHUNG LÀM BÀI */
        #mainApp {
            display: none;
            height: 100vh;
            width: 100vw;
        }
        #left { flex: 7; border-right: 2px solid #ccc; background: #e0e0e0; }
        #right { flex: 3; padding: 20px; overflow-y: auto; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .question { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .tf-group { margin-left: 15px; margin-bottom: 10px; padding: 5px; border-left: 3px solid #007bff; }
        .option { margin-right: 5px; padding: 5px 12px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; font-size: 13px; }
        .selected { background-color: #007bff; color: white; border-color: #0056b3; }
        .correct-answer { border: 2px solid green !important; background-color: #e8f5e9 !important; }
        .wrong-answer { border: 2px solid red !important; background-color: #ffebee !important; }
        .feedback { font-weight: bold; margin-top: 5px; display: block; color: #333; }
        input[type="text"] { width: 90%; padding: 8px; margin-top: 5px; }
        
        #timer {
            position: sticky;
            top: 0;
            background: #ff4444;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            z-index: 100;
            border-radius: 5px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .user-tag {
            background: #e7f3ff;
            color: #0056b3;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- 1. POPUP BẮT BUỘC ĐIỀN DANH TÍNH & MẬT KHẨU -->
<div id="authOverlay">
    <div class="auth-card">
        <h2 style="margin-top:0; color:#333;">🔒 PHÒNG THI ONLINE</h2>
        <p style="font-size:13px; color:#666; margin-bottom:15px;">Điền đủ thông tin để kích hoạt bài thi:</p>
        <input type="text" id="rawName" placeholder="Họ và tên thí sinh...">
        <input type="text" id="rawClass" placeholder="Lớp (ví dụ: 12A1)...">
        <input type="password" id="rawKey" placeholder="Mật mã làm bài...">
        <button onclick="startApp()">VÀO LÀM BÀI</button>
        <p id="authMsg" style="color:red; font-size:13px; margin-top:10px; display:none; font-weight:bold;"></p>
    </div>
</div>

<!-- 2. GIAO DIỆN BÀI THI CHÍNH -->
<div id="mainApp">
    <div id="left">
        <iframe 
            src="https://drive.google.com/file/d/1ZjnpxtdleUo_vbwGqC3tzdJBzrYdFww7/preview" 
            sandbox="allow-scripts allow-same-origin">
        </iframe>
    </div>

    <div id="right">
        <div id="timer">Thời gian còn lại: 90:00</div>
        <div class="user-tag" id="userHeader"></div>
        <h2>Phiếu Trả Lời</h2>
        <div id="quizContainer"></div>
        <button id="submitBtn" onclick="submitExam(false)" style="padding: 12px; background: #28a745; color: white; border: none; cursor: pointer; width: 100%; font-weight: bold;">Nộp bài</button>
    </div>
</div>

<script>
    const SECRET_KEY = "TOAN2026";
    // Thay link Web App mới triển khai từ Google Apps Script của Sheet mới vào đây:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmhQrMeGNmPFcHUpLF2VoFHGh_833ffzQzWW4kUVWC-qoEDbQfgZOI2VRGhQOvEoVn/exec";

    let studentProfile = { name: "", class: "" };
    let isTestRunning = false;
    let isSubmitted = false;
    let tabViolations = 0;
    const MAX_VIOLATIONS = 3;
    let isTabAway = false;

    // Bộ câu hỏi và đáp án[cite: 4]
    const questions = [
        { id: 1, type: 'mcq', correct: 'A' },
        { id: 2, type: 'mcq', correct: 'A' },
        { id: 3, type: 'mcq', correct: 'B' },
        { id: 4, type: 'mcq', correct: 'D' },
        { id: 5, type: 'mcq', correct: 'C' },
        { id: 6, type: 'mcq', correct: 'B' },
        { id: 7, type: 'mcq', correct: 'A' },
        { id: 8, type: 'mcq', correct: 'A' },
        { id: 9, type: 'mcq', correct: 'A' },
        { id: 10, type: 'mcq', correct: 'A' },
        { id: 11, type: 'mcq', correct: 'B' },
        { id: 12, type: 'mcq', correct: 'D' },
        { id: 13, type: 'tf_group', correct: {a: 'true', b: 'true', c: 'true', d: 'false'} },
        { id: 14, type: 'tf_group', correct: {a: 'true', b: 'false', c: 'true', d: 'false'} },
        { id: 15, type: 'tf_group', correct: {a: 'true', b: 'true', c: 'false', d: 'true'} },
        { id: 16, type: 'tf_group', correct: {a: 'true', b: 'false', c: 'false', d: 'false'} },
        { id: 17, type: 'text', correct: '0,38' },
        { id: 18, type: 'text', correct: '1080' },
        { id: 19, type: 'text', correct: '1273' },
        { id: 20, type: 'text', correct: '7200' },
        { id: 21, type: 'text', correct: '14,1' },
        { id: 22, type: 'text', correct: '4,77' }
    ];

    const userAnswers = {};

    // 1. XÁC THỰC VÀO PHÒNG THI
    function startApp() {
        const name = document.getElementById("rawName").value.trim();
        const className = document.getElementById("rawClass").value.trim();
        const key = document.getElementById("rawKey").value;
        const msg = document.getElementById("authMsg");

        if (!name || !className) {
            msg.innerText = "Bắt buộc điền Họ tên và Lớp!";
            msg.style.display = "block";
            return;
        }

        if (key !== SECRET_KEY) {
            msg.innerText = "Mật mã phòng thi không đúng!";
            msg.style.display = "block";
            document.getElementById("rawKey").value = "";
            return;
        }

        studentProfile.name = name;
        studentProfile.class = className;

        document.getElementById("authOverlay").style.display = "none";
        document.getElementById("mainApp").style.display = "flex";
        document.getElementById("userHeader").innerHTML = `Thí sinh: ${studentProfile.name} | Lớp: ${studentProfile.class}`;

        isTestRunning = true;
        renderQuiz();
        startTimer();
    }

    // 2. TẠO GIAO DIỆN PHIẾU ĐÁP ÁN
    function renderQuiz() {
        const container = document.getElementById('quizContainer');
        container.innerHTML = "";
        questions.forEach(q => {
            const div = document.createElement('div');
            div.className = 'question';
            div.id = `q-${q.id}`;
            
            if (q.type === 'mcq') {
                div.innerHTML = `<strong>Câu ${q.id}:</strong><br>`;
                ['A', 'B', 'C', 'D'].forEach(opt => {
                    div.innerHTML += `<button type="button" class="option" onclick="chooseMcq(${q.id}, '${opt}', this)">${opt}</button>`;
                });
            } else if (q.type === 'tf_group') {
                div.innerHTML = `<strong>Câu ${q.id}:</strong> (Đúng/Sai)<br>`;
                ['a', 'b', 'c', 'd'].forEach(sub => {
                    const subDiv = document.createElement('div');
                    subDiv.className = 'tf-group';
                    subDiv.innerHTML = `Ý ${sub}: `;
                    ['Đúng', 'Sai'].forEach(label => {
                        const val = (label === 'Đúng' ? 'true' : 'false');
                        subDiv.innerHTML += `<button type="button" class="option" onclick="chooseTf(${q.id}, '${sub}', '${val}', this)">${label}</button>`;
                    });
                    div.appendChild(subDiv);
                });
            } else {
                div.innerHTML = `<strong>Câu ${q.id}:</strong> (Trả lời ngắn)<br>`;
                div.innerHTML += `<input type="text" oninput="saveTextAns(${q.id}, this.value)" placeholder="Nhập đáp án...">`;
            }
            container.appendChild(div);
        });
    }

    function chooseMcq(id, val, btn) {
        if (!isTestRunning || isSubmitted) return;
        userAnswers[id] = val;
        btn.parentElement.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function chooseTf(id, sub, val, btn) {
        if (!isTestRunning || isSubmitted) return;
        if (!userAnswers[id]) userAnswers[id] = {};
        userAnswers[id][sub] = val;
        btn.parentElement.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function saveTextAns(id, val) {
        if (!isTestRunning || isSubmitted) return;
        userAnswers[id] = val.toLowerCase().trim();
    }

    // 3. ĐỒNG HỒ ĐẾM NGƯỢC
    let timeLeft = 90 * 60;
    let timerInterval = null;

    function startTimer() {
        const timerDisplay = document.getElementById('timer');
        timerInterval = setInterval(() => {
            if (isSubmitted) {
                clearInterval(timerInterval);
                return;
            }
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            timerDisplay.innerHTML = `Thời gian còn lại: ${m}:${s < 10 ? '0' : ''}${s}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("Đã hết giờ làm bài!");
                submitExam(false, "Hết giờ nộp bài");
            }
            timeLeft--;
        }, 1000);
    }

    // 4. HÀM CHẤM ĐIỂM, TÁCH TỪNG PHẦN VÀ GỬI GOOGLE SHEET
    function submitExam(isDisqualified = false, note = "Nộp bài bình thường") {
        if (isSubmitted) return;
        isSubmitted = true;
        isTestRunning = false;
        clearInterval(timerInterval);

        let scoreP1 = 0;
        let scoreP2 = 0;
        let scoreP3 = 0;

        // Tính điểm từng phần theo thang chuẩn
        questions.forEach(q => {
            if (q.type === 'mcq') {
                if (userAnswers[q.id] === q.correct) scoreP1 += 0.25;
            } else if (q.type === 'tf_group') {
                let rightSub = 0;
                const userAns = userAnswers[q.id] || {};
                ['a', 'b', 'c', 'd'].forEach(sub => {
                    if (userAns[sub] === q.correct[sub]) rightSub++;
                });
                if (rightSub === 1) scoreP2 += 0.1;
                else if (rightSub === 2) scoreP2 += 0.25;
                else if (rightSub === 3) scoreP2 += 0.5;
                else if (rightSub === 4) scoreP2 += 1.0;
            } else if (q.type === 'text') {
                if (userAnswers[q.id] === q.correct) scoreP3 += 0.5;
            }
        });

        scoreP1 = Math.round(scoreP1 * 100) / 100;
        scoreP2 = Math.round(scoreP2 * 100) / 100;
        scoreP3 = Math.round(scoreP3 * 100) / 100;
        let totalScore = Math.round((scoreP1 + scoreP2 + scoreP3) * 100) / 100;

        // Gửi kết quả về Google Sheets bằng FormData
        const fd = new FormData();
        fd.append("Họ và Tên", studentProfile.name);
        fd.append("Lớp", studentProfile.class);
        fd.append("Điểm tổng", totalScore);
        fd.append("Phần 1", scoreP1);
        fd.append("Phần 2", scoreP2);
        fd.append("Phần 3", scoreP3);
        fd.append("Ghi chú", `${note} | Rời tab: ${tabViolations} lần`);

        fetch(SCRIPT_URL, {
            method: "POST",
            body: fd
        });

        const timerDisplay = document.getElementById('timer');
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.style.display = "none";

        if (isDisqualified) {
            // VI PHẠM: Xóa hoàn toàn đề và phiếu đáp án, không hiển thị bất kỳ đáp án nào
            document.getElementById("left").innerHTML = "<div style='display:flex;align-items:center;justify-content:center;height:100%;color:#c00;'><h2>ĐÃ ĐÓNG ĐỀ THI DO VI PHẠM</h2></div>";
            document.getElementById("quizContainer").innerHTML = `
                <div style="background:#ffebee; border:2px solid red; padding:20px; border-radius:8px; margin-top:20px; text-align:center;">
                    <h3 style="color:#d32f2f; margin-top:0;">⛔ BÀI THI BỊ ĐÌNH CHỈ</h3>
                    <p><b>Lý do:</b> Rời khỏi màn hình làm bài quá ${MAX_VIOLATIONS} lần quy định.</p>
                    <p style="color:#333;">Dữ liệu vi phạm của thí sinh <b>${studentProfile.name}</b> đã được gửi về hệ thống quản lý.</p>
                    <p style="color:#777; font-size:13px;">Hệ thống khóa toàn bộ đề thi và không cung cấp đáp án chi tiết.</p>
                </div>`;
            timerDisplay.innerHTML = "ĐÃ HỦY QUYỀN LÀM BÀI";
            timerDisplay.style.background = "#000";
        } else {
            // NỘP HỢP LỆ: Hiển thị kết quả đúng/sai trên phiếu
            questions.forEach(q => {
                const el = document.getElementById(`q-${q.id}`);
                if (!el) return;
                let isRight = false;
                if (q.type === 'mcq' || q.type === 'text') {
                    isRight = (userAnswers[q.id] === q.correct);
                } else {
                    let c = 0;
                    ['a', 'b', 'c', 'd'].forEach(sub => {
                        if ((userAnswers[q.id] || {})[sub] === q.correct[sub]) c++;
                    });
                    isRight = (c === 4);
                }
                el.classList.add(isRight ? 'correct-answer' : 'wrong-answer');
                el.innerHTML += `<span class="feedback">${isRight ? '✅ Đúng' : '❌ Sai'} (ĐA: ${typeof q.correct === 'object' ? JSON.stringify(q.correct) : q.correct})</span>`;
                el.querySelectorAll('button, input').forEach(i => i.disabled = true);
            });
            timerDisplay.innerHTML = "ĐÃ NỘP BÀI THÀNH CÔNG";
            timerDisplay.style.background = "#28a745";
            alert(`Nộp bài thành công!\nTổng điểm: ${totalScore}/10\n(P1: ${scoreP1}đ | P2: ${scoreP2}đ | P3: ${scoreP3}đ)`);
        }
    }

    // 5. GIÁM SÁT CHUYỂN TAB VÀ TRỪNG PHẠT
    document.addEventListener("visibilitychange", function() {
        if (!isTestRunning || isSubmitted) return;

        if (document.hidden) {
            isTabAway = true;
        } else if (isTabAway) {
            isTabAway = false;
            tabViolations++;

            if (tabViolations >= MAX_VIOLATIONS) {
                alert(`⚠️ CẢNH BÁO VI PHẠM NGHIÊM TRỌNG:\nThí sinh ${studentProfile.name} đã rời trang thi lần thứ ${tabViolations}!\nBài thi lập tức bị đình chỉ và thu bài.`);
                submitExam(true, `ĐÌNH CHỈ - Chuyển tab ${tabViolations} lần`);
            } else {
                alert(`⚠️ CẢNH BÁO QUY CHẾ (Lần ${tabViolations}/${MAX_VIOLATIONS}):\nKhông được phép chuyển tab hoặc thoát ứng dụng trong lúc làm bài!\nNếu vi phạm đủ ${MAX_VIOLATIONS} lần, bài thi sẽ lập tức bị khóa và không hiện đáp án.`);
            }
        }
    });

    window.addEventListener("blur", function() {
        if (isTestRunning && !isSubmitted) {
            isTabAway = true;
        }
    });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Kiểm Tra Trực Tuyến</title>
    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; }
        #left { flex: 7; border-right: 2px solid #ccc; background: #f0f0f0; }
        #right { flex: 3; padding: 20px; overflow-y: auto; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .question { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .tf-group { margin-left: 15px; margin-bottom: 10px; padding: 5px; border-left: 3px solid #007bff; }
        .option { margin-right: 5px; padding: 5px 12px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 4px; font-size: 13px; }
        .selected { background-color: #007bff; color: white; border-color: #0056b3; }
        .correct-answer { border: 2px solid green !important; background-color: #e8f5e9 !important; }
        .wrong-answer { border: 2px solid red !important; background-color: #ffebee !important; }
        .feedback { font-weight: bold; margin-top: 5px; display: block; color: #333; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        /* Đồng hồ đếm ngược */
        #timer {
            position: sticky;
            top: 0;
            background: #ff4444;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            z-index: 100;
            border-radius: 5px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .student-header {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<!-- Khung khóa bảo mật mật khẩu + Nhập danh tính học sinh -->
<div id="authOverlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; align-items: center; justify-content: center;">
    <div style="background: #fff; padding: 30px; border-radius: 8px; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
        <h3 style="margin-top: 0; color: #333;">🔒 THÔNG TIN THÍ SINH</h3>
        <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Vui lòng điền đủ thông tin và mã thi để mở đề:</p>
        
        <input type="text" id="inputFullName" placeholder="Họ và tên học sinh..." required>
        <input type="text" id="inputClassName" placeholder="Lớp (VD: 12A1)..." required>
        <input type="password" id="inputPass" placeholder="Nhập mật mã làm bài..." required>
        
        <button onclick="checkPass()" style="width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 16px;">VÀO LÀM BÀI</button>
        <p id="authError" style="color: red; margin-top: 10px; display: none; font-size: 13px; font-weight: bold;"></p>
    </div>
</div>

<div id="left">
    <iframe 
        id="pdfFrame"
        src="https://drive.google.com/file/d/1ZjnpxtdleUo_vbwGqC3tzdJBzrYdFww7/preview" 
        width="100%" 
        height="600px" 
        sandbox="allow-scripts allow-same-origin">
    </iframe>
</div>

<div id="right">
    <div id="timer">Thời gian còn lại: 90:00</div>
    <div class="student-header" id="studentDisplay" style="display:none;"></div>
    <h2>Phiếu Trả Lời</h2>
    <div id="quizContainer"></div>
    <button id="submitBtn" onclick="submitTest(false)" style="padding: 12px; background: #28a745; color: white; border: none; cursor: pointer; width: 100%; font-weight: bold;">Nộp bài</button>
</div>

<script>
    const secretKey = "TOAN2026"; 
    let studentInfo = { name: "", class: "" };

    function checkPass() {
        const name = document.getElementById("inputFullName").value.trim();
        const className = document.getElementById("inputClassName").value.trim();
        const entered = document.getElementById("inputPass").value;
        const err = document.getElementById("authError");

        if (!name || !className) {
            err.innerText = "Vui lòng nhập đầy đủ Họ tên và Lớp!";
            err.style.display = "block";
            return;
        }

        if (entered === secretKey) {
            studentInfo.name = name;
            studentInfo.class = className;
            document.getElementById("studentDisplay").innerHTML = `Thí sinh: <b>${name}</b> | Lớp: <b>${className}</b>`;
            document.getElementById("studentDisplay").style.display = "block";
            document.getElementById("authOverlay").style.display = "none";
        } else {
            err.innerText = "Sai mật mã, vui lòng nhập lại!";
            err.style.display = "block";
            document.getElementById("inputPass").value = "";
            document.getElementById("inputPass").focus();
        }
    }

    document.getElementById("inputPass").addEventListener("keyup", function(event) {
        if (event.key === "Enter") checkPass();
    });

    const questions = [
        { id: 1, type: 'mcq', correct: 'A' },
        { id: 2, type: 'mcq', correct: 'A' },
        { id: 3, type: 'mcq', correct: 'B' },
        { id: 4, type: 'mcq', correct: 'D' },
        { id: 5, type: 'mcq', correct: 'C' },
        { id: 6, type: 'mcq', correct: 'B' },
        { id: 7, type: 'mcq', correct: 'A' },
        { id: 8, type: 'mcq', correct: 'A' },
        { id: 9, type: 'mcq', correct: 'A' },
        { id: 10, type: 'mcq', correct: 'A' },
        { id: 11, type: 'mcq', correct: 'B' },
        { id: 12, type: 'mcq', correct: 'D' },
        { id: 13, type: 'tf_group', correct: {a: 'true', b: 'true', c: 'true', d: 'false'} },
        { id: 14, type: 'tf_group', correct: {a: 'true', b: 'false', c: 'true', d: 'false'} },
        { id: 15, type: 'tf_group', correct: {a: 'true', b: 'true', c: 'false', d: 'true'} },
        { id: 16, type: 'tf_group', correct: {a: 'true', b: 'false', c: 'false', d: 'false'} },
        { id: 17, type: 'text', correct: '0,38' },
        { id: 18, type: 'text', correct: '1080' },
        { id: 19, type: 'text', correct: '1273' },
        { id: 20, type: 'text', correct: '7200' },
        { id: 21, type: 'text', correct: '14,1' },
        { id: 22, type: 'text', correct: '4,77' }
    ];

    const userAnswers = {};
    const container = document.getElementById('quizContainer');
    let isSubmitted = false;

    let timeLeft = 90 * 60;
    const timerDisplay = document.getElementById('timer');

    const countdown = setInterval(() => {
        if (isSubmitted) {
            clearInterval(countdown);
            return;
        }

        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerDisplay.innerHTML = `Thời gian còn lại: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;

        if (timeLeft <= 0) {
            clearInterval(countdown);
            alert("Hết giờ làm bài! Hệ thống tự động thu bài.");
            submitTest(false, "Hết giờ nộp bài");
        }
        timeLeft--;
    }, 1000);

    questions.forEach(q => {
        const div = document.createElement('div');
        div.className = 'question';
        div.id = `q-${q.id}`;
        
        if (q.type === 'mcq') {
            div.innerHTML = `<strong>Câu ${q.id}:</strong> (MCQ)<br>`;
            ['A', 'B', 'C', 'D'].forEach(opt => {
                div.innerHTML += `<button class="option" onclick="selectAnswer(${q.id}, '${opt}', this)">${opt}</button>`;
            });
        } else if (q.type === 'tf_group') {
            div.innerHTML = `<strong>Câu ${q.id}:</strong> (Đúng/Sai)<br>`;
            ['a', 'b', 'c', 'd'].forEach(sub => {
                const subDiv = document.createElement('div');
                subDiv.className = 'tf-group';
                subDiv.innerHTML = `Ý ${sub}: `;
                ['Đúng', 'Sai'].forEach(label => {
                    const val = (label === 'Đúng' ? 'true' : 'false');
                    subDiv.innerHTML += `<button class="option" onclick="selectSubAnswer(${q.id}, '${sub}', '${val}', this)">${label}</button>`;
                });
                div.appendChild(subDiv);
            });
        } else {
            div.innerHTML = `<strong>Câu ${q.id}:</strong> (Ngắn)<br>`;
            div.innerHTML += `<input type="text" oninput="saveText(${q.id}, this.value)" placeholder="Nhập đáp án...">`;
        }
        container.appendChild(div);
    });

    function selectAnswer(id, val, btn) {
        if (isSubmitted) return;
        userAnswers[id] = val;
        btn.parentElement.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function selectSubAnswer(id, sub, val, btn) {
        if (isSubmitted) return;
        if (!userAnswers[id]) userAnswers[id] = {};
        userAnswers[id][sub] = val;
        btn.parentElement.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function saveText(id, val) {
        if (isSubmitted) return;
        userAnswers[id] = val.toLowerCase().trim();
    }

    // isViolation = true: Khóa màn hình, xóa đáp án, không cho xem lại
    async function submitTest(isViolation = false, note = "Nộp bài bình thường") {
        if (isSubmitted) return;
        isSubmitted = true;
        clearInterval(countdown);

        let totalScore = 0;
        let logDetails = [];

        questions.forEach(q => {
            const el = document.getElementById(`q-${q.id}`);
            let qScore = 0;

            if (q.type === 'mcq') {
                const isCorrect = (userAnswers[q.id] === q.correct);
                if (isCorrect) qScore = 0.25;
                if (!isViolation) {
                    el.classList.add(isCorrect ? 'correct-answer' : 'wrong-answer');
                    el.innerHTML += `<span class="feedback">${isCorrect ? '✅' : '❌'} ĐA: ${q.correct} (+${qScore})</span>`;
                }
            } 
            else if (q.type === 'tf_group') {
                let correctSubCount = 0;
                const userAns = userAnswers[q.id] || {};
                ['a', 'b', 'c', 'd'].forEach(sub => {
                    if (userAns[sub] === q.correct[sub]) correctSubCount++;
                });

                if (correctSubCount === 1) qScore = 0.1;
                else if (correctSubCount === 2) qScore = 0.25;
                else if (correctSubCount === 3) qScore = 0.5;
                else if (correctSubCount === 4) qScore = 1.0;

                if (!isViolation) {
                    el.classList.add(correctSubCount > 0 ? 'correct-answer' : 'wrong-answer');
                    el.innerHTML += `<span class="feedback">Đúng ${correctSubCount}/4 ý (+${qScore})</span>`;
                }
            } 
            else {
                const isCorrect = (userAnswers[q.id] === q.correct);
                if (isCorrect) qScore = 0.5;
                if (!isViolation) {
                    el.classList.add(isCorrect ? 'correct-answer' : 'wrong-answer');
                    el.innerHTML += `<span class="feedback">${isCorrect ? '✅' : '❌'} ĐA: ${q.correct} (+${qScore})</span>`;
                }
            }

            totalScore += qScore;
            logDetails.push(`C${q.id}:${qScore}đ`);
            if (el) el.querySelectorAll('button, input').forEach(i => i.disabled = true);
        });

        totalScore = Math.round(totalScore * 100) / 100;
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').style.background = "#ccc";

        // Gửi kết quả về Google Sheets
        const scriptUrl = "https://script.google.com/macros/s/AKfycbzMaq-bBNkCHLM9iUjCVKdwnaJSzD8jXPnloKqdYnHySYOLWdNM0ru4FX47jYcQBefD/exec";
        fetch(scriptUrl, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({ 
                className: `${studentInfo.class} - ${studentInfo.name}`, 
                results: `Tổng: ${totalScore}/10 | ${note} | Rời tab: ${tabSwitchCount} lần | Chi tiết: ${logDetails.join('|')}` 
            })
        });

        // Xử lý giao diện khi bị vi phạm
        if (isViolation) {
            timerDisplay.innerHTML = "BÀI BỊ HỦY DO VI PHẠM";
            timerDisplay.style.background = "#000";
            // Xóa sạch nội dung đề PDF và cột đáp án để chống xem trộm
            document.getElementById("left").innerHTML = "<div style='display:flex;align-items:center;justify-content:center;height:100%;color:#888;'><h3>ĐÃ KHÓA ĐỀ THI</h3></div>";
            document.getElementById("quizContainer").innerHTML = "<h3 style='color:red;text-align:center;margin-top:40px;'>⚠️ Bài thi đã bị thu tự động do vi phạm quy chế chuyển tab quá 3 lần!<br><br>Hệ thống không hiển thị đáp án.</h3>";
            document.getElementById("submitBtn").style.display = "none";
        } else {
            timerDisplay.innerHTML = "BÀI ĐÃ NỘP";
            timerDisplay.style.background = "#28a745";
            alert(`Nộp bài thành công!\nĐiểm của bạn: ${totalScore}/10`);
        }
    }

    // --- THEO DÕI VI PHẠM RỜI TAB ---
    let tabSwitchCount = 0;
    const MAX_TAB_SWITCH = 3;
    let wasLeft = false;

    document.addEventListener("visibilitychange", function() {
        const isAuthPassed = document.getElementById("authOverlay").style.display === "none";
        if (!isAuthPassed || isSubmitted) return;

        if (document.hidden) {
            wasLeft = true;
        } else if (wasLeft) {
            wasLeft = false;
            tabSwitchCount++;

            if (tabSwitchCount >= MAX_TAB_SWITCH) {
                alert(`⚠️ VI PHẠM QUY CHẾ:\nBạn đã chuyển tab ${tabSwitchCount} lần!\nBài thi sẽ bị thu và KHÓA TOÀN BỘ ngay lập tức.`);
                submitTest(true, `VI PHẠM chuyển tab ${tabSwitchCount} lần`);
            } else {
                alert(`⚠️ CẢNH BÁO VI PHẠM (Lần ${tabSwitchCount}/${MAX_TAB_SWITCH}):\nKhông được rời khỏi màn hình làm bài! Vi phạm đủ 3 lần hệ thống sẽ tự động thu bài và không hiển thị đáp án.`);
            }
        }
    });

    window.addEventListener("blur", function() {
        const isAuthPassed = document.getElementById("authOverlay").style.display === "none";
        if (isAuthPassed && !isSubmitted) {
            wasLeft = true;
        }
    });
</script>
</body>
</html>
